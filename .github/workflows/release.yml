name: Release

on:
  release:
    types: [published]

# ---------------------------------------------------------------------------
# This workflow triggers when you publish a GitHub Release.
# It builds SectorForge for Windows and Linux, then uploads the built
# binaries (.exe, .msi, .appimage, .deb, etc.) back to the SAME release.
# ---------------------------------------------------------------------------

jobs:
  build-windows:
    name: Build Windows binaries
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install Rust
        uses: dtolnay/rust-action@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Install frontend dependencies
        run: bun install

      # -------------------------------------------------------------------
      # Build the app AND upload artifacts to the existing GitHub release.
      # The tauri-action detects releaseId and uploads .exe, .msi, etc.
      # directly to the release page you just published.
      # -------------------------------------------------------------------
      - name: Build & upload to release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          # Upload to the EXISTING release (triggered by release: published)
          releaseId: ${{ github.event.release.id }}
          args: --target x86_64-pc-windows-msvc

  build-linux:
    name: Build Linux binaries
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install Rust
        uses: dtolnay/rust-action@stable
        with:
          targets: x86_64-unknown-linux-gnu

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Install frontend dependencies
        run: bun install

      - name: Build & upload to release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          releaseId: ${{ github.event.release.id }}
          args: --target x86_64-unknown-linux-gnu
